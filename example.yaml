# ============================================================================
#  DucoBox Energy Comfort Plus D450 R  --  voorbeeldconfiguratie
# ============================================================================
#
#  De sensoren staan in dezelfde volgorde als duco-parameters-per-module.md, en
#  worden opgevraagd op hun VOLLEDIGE API-pad (`param: Ventilation.Fan.PressSup`).
#  Die namen komen uit /info en /config van de communicatieprint; de adressen
#  erachter zijn op de bus waargenomen en staan in components/duco/duco_verified.h.
#
#  Waarom het volledige pad en niet alleen de bladnaam: namen als `State`, `Mode`
#  en `NodeIn` komen in meerdere modules voor. Een bladnaam die maar EEN keer
#  bestaat werkt ook (`param: PressSup`), maar bij twijfel is het pad eenduidig.
#
#  LET OP -- dit bestand zet ALLE 123 geverifieerde parameters neer. Dat is veel
#  entiteiten voor Home Assistant. Bedoeld als naslag: knip eruit wat je nodig
#  hebt. De meeste zijn `entity_category: diagnostic`, zodat ze niet in het
#  hoofdoverzicht terechtkomen.
#
#  Twee schalen om in de gaten te houden: de VENTILATORdrukken staan in 0,1 Pa
#  (bus 240 = 24,0 Pa), de INREGELdrukken in hele Pa. Dat is hieronder al verwerkt.
# ============================================================================

esphome:
  name: duco-gw
  friendly_name: DUCO-GW

esp32:
  board: wt32-eth01
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

# WT32-ETH01 heeft bedrade ethernet. Gebruik je een gewone ESP32, vervang dit
# blok dan door een `wifi:`-blok.
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  phy_addr: 1
  power_pin: GPIO16
  clk:
    mode: CLK_EXT_IN
    pin: 0

external_components:
  - source:
      type: local
      path: components
    components: [duco]

# Tijdbron. Nodig voor het gelijkzetten van de boxklok (`time_id` hieronder).
# `homeassistant` kan ook, maar sntp werkt ook zonder verbinding met HA.
time:
  - platform: sntp
    id: esp_time
    timezone: Europe/Amsterdam

uart:
  id: duco_uart
  tx_pin: GPIO17
  rx_pin: GPIO33
  baud_rate: 57600
  rx_buffer_size: 256

duco:
  id: my_duco
  uart_id: duco_uart
  time_id: esp_time
  update_interval: 15s
  comm_responder: true
  # Identiteit die de ESP als communicatieprint aan de box meldt. Zonder deze
  # twee serienummers valt de component terug op plaatshouders en toont het
  # boxdisplay het LAN-menu niet. Vul hier de nummers van je EIGEN print in.
  comm_identity:
    serial_board: "PS2335000000"
    serial_duco: "P200002-230101-002"
  # Zet eenmalig op bv. 90 om de nodenummers te ontdekken, daarna terug op 0.
  scan_max: 0
  # --- alleen voor foutzoeken ---------------------------------------------
  # debug_raw: true    # log elke ruwe byte, zoals de sniffer
  # sniffer: true      # stuur alleen een probe en dump alles
  # passive: true      # nooit zenden; decoderen gaat wel door
  # decode_log: true   # log de gedecodeerde frames
  # --- klok van de box gelijkzetten ---------------------------------------
  # Duwt 0x24 sub 05 ALLEEN als de ESP-tijd geldig is en de box meer dan
  # time_threshold afwijkt.
  time_threshold: 2s

