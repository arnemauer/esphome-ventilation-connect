# ============================================================================
#  Per node -- live waarden
# ============================================================================
#  Node 1 = de DucoBox zelf. Pas de nodenummers aan op je eigen installatie
#  (zet scan_max eenmalig op 90 om ze te vinden).
#  `uptime`, `co2` en `temp` komen alle drie uit hetzelfde 0x49-blok.
#  NB: `uptime` heette eerder `iaq_co2`; dat was fout. Offset 8 is de uptime van
#  de node in minuten, geen luchtkwaliteitspercentage. De oude naam werkt nog.

  - platform: duco
    duco_id: my_duco
    node: 1
    type: uptime
    name: "Node 1 uptime"
    unit_of_measurement: "min"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    node: 4
    type: co2
    name: "Node 4 CO2"
    unit_of_measurement: "ppm"
    device_class: carbon_dioxide
  - platform: duco
    duco_id: my_duco
    node: 4
    type: temp
    name: "Node 4 temperatuur"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
  - platform: duco
    duco_id: my_duco
    node: 4
    type: flow
    name: "Node 4 debiet"
    unit_of_measurement: "%"

# ============================================================================
#  Identity-velden (handshake print <-> box, geen box-parameters)
# ============================================================================
#  Deze waarden reizen niet als parameter maar in de 0x20/0x22-handshake.
#  Groep 1 = de STATISCHE netwerkconfiguratie, groep 2 = wat er in gebruik is.

text_sensor:
  # ---- General.Board (identiteit van de communicatieprint) ----
  - platform: duco
    duco_id: my_duco
    type: comm_serial_board
    name: "General.Board.SerialBoardComm"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_serial_duco
    name: "General.Board.SerialDucoComm"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_sw_version
    name: "General.Board.SwVersionComm"
    entity_category: diagnostic
  # SerialDucoBox komt ook als box-parameterreeks 0x0602..0x0606
  - platform: duco
    duco_id: my_duco
    type: box_serial
    name: "General.Board.SerialDucoBox"
    entity_category: diagnostic
  # Het printplaatnummer van de box zit in node-register 0x08, niet in een
  # box-parameter. Gevonden door in de reboot-opname op de ruwe bytes te zoeken.
  - platform: duco
    duco_id: my_duco
    node: 1
    type: serial_board
    name: "General.Board.SerialBoardBox"
    entity_category: diagnostic

  # ---- General.Lan ----
  - platform: duco
    duco_id: my_duco
    type: comm_ip
    name: "General.Lan.Ip"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_gateway
    name: "General.Lan.DefaultGateway"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_netmask
    name: "General.Lan.NetMask"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_hostname
    name: "General.Lan.HostName"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_static_ip
    name: "General.Lan.StaticIp"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_static_netmask
    name: "General.Lan.StaticNetMask"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_static_gateway
    name: "General.Lan.StaticDefaultGateway"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: comm_static_dns
    name: "General.Lan.StaticDns"
    entity_category: diagnostic
  # De WiFi-AP-sleutel staat in box-parameters 0x060A..0x060C en wordt door de
  # print EEN keer gelezen, kort na zijn eigen boot.
  - platform: duco
    duco_id: my_duco
    type: box_wifi_ap_key
    name: "General.Lan.WifiApKey"
    entity_category: diagnostic

  # ---- Klok van de box ----
  - platform: duco
    duco_id: my_duco
    type: box_time
    name: "General.Board.TimeUtc"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: box_time_local
    name: "General.Board.Time"
    entity_category: diagnostic
  - platform: duco
    duco_id: my_duco
    type: box_timezone_utc
    name: "Box tijdzone UTC"
    entity_category: diagnostic
  # Install mode: de box kondigt dit ongevraagd aan met 0x2C 0C 01 04 <n>.
  - platform: duco
    duco_id: my_duco
    type: install_mode
    name: "General.NetworkDuco.State"
    entity_category: diagnostic

# ============================================================================
#  Node-parameters (service 6) -- lezen EN schrijven
# ============================================================================
#  Lezen `0x18 00 <node> <param>`, schrijven `0x18 01 <node> <param> <u16 BE>`.
#  Let op de asymmetrie: de leesreply is little-endian, de schrijfvraag
#  big-endian. Bereik en stapgrootte levert de box zelf mee.

number:
  - platform: duco
    duco_id: my_duco
    node: 1
    type: time_man
    name: "Duur handmatige stand"
    unit_of_measurement: "min"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    node: 1
    type: flow_lvl_man1
    name: "Stand MAN1 debiet"
    unit_of_measurement: "%"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    node: 1
    type: flow_lvl_man2
    name: "Stand MAN2 debiet"
    unit_of_measurement: "%"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    node: 1
    type: flow_lvl_man3
    name: "Stand MAN3 debiet"
    unit_of_measurement: "%"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    node: 4
    type: co2_setpoint
    name: "Node 4 CO2-instelpunt"
    unit_of_measurement: "ppm"
    entity_category: config
  # Klokinstellingen van de box (box-parameters 0x0802 / 0x0806). Negatieve
  # tijdzones gaan als tweecomplement over de bus; gecontroleerd met -10 en -11.
  - platform: duco
    duco_id: my_duco
    type: box_timezone
    name: "Box tijdzone instellen"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    type: box_dst
    name: "Box zomertijd instellen"
    entity_category: config

# ============================================================================
#  Keuzelijsten
# ============================================================================

select:
  # Ventilatiestand per node. De x2/x3-varianten zijn echt instelbaar: de
  # firmware pakt een druktelling in de bovenste twee bits (waarde = n<<6 | stand).
  - platform: duco
    duco_id: my_duco
    node: 1
    name: "Ventilatiestand"

  # Node-parameters met benoemde waarden. De positie in de lijst IS de buswaarde.
  - platform: duco
    duco_id: my_duco
    node: 1
    param: uc_error_mode
    name: "Bedieningsschakelaar foutmodus"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    node: 52
    param: switch_mode
    name: "Schakelmodus"
    entity_category: config

  # Acties met een enum. Een /action met ValType Enum is geen apart mechanisme:
  # de print vertaalt hem naar een gewone box-parameterschrijfactie.
  - platform: duco
    duco_id: my_duco
    action: identify_zone
    name: "Zone identificeren"
    entity_category: config
  # LET OP: alles behalve STOP start een echte inregelprocedure die de
  # ventilatoren op uitersten laat draaien.
  - platform: duco
    duco_id: my_duco
    action: calibration_state
    name: "Inregeling"
    entity_category: config

# ============================================================================
#  Knoppen -- node-acties (svc4 `0x10 <sub> <node>`)
# ============================================================================
#  0x04 identify, 0x08 herstarten, 0x0A config resetten, 0x0B link mode.

button:
  - platform: duco
    duco_id: my_duco
    action: filter_reset
    name: "Filtertimer resetten"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    action: install_mode_on
    name: "Install mode aan"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    action: install_mode_off
    name: "Install mode uit"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    node: 4
    action: identify_on
    name: "Node 4 identificeren"
    entity_category: config
  - platform: duco
    duco_id: my_duco
    node: 4
    action: reboot
    name: "Node 4 herstarten"
    entity_category: config
  # Link mode werkt ALLEEN met de box in install mode. Daarbuiten weigert de
  # print het commando lokaal en gaat er niets de bus op.
  - platform: duco
    duco_id: my_duco
    node: 4
    action: link_mode_on
    name: "Node 4 link mode aan"
    entity_category: config
  # Bewust uitgecommentarieerd: reset_config zet de configuratie van een node
  # terug naar fabriekswaarden, en er is geen commando om dat terug te draaien.
  # Haal het commentaar weg als je die knop echt wilt.
  # - platform: duco
  #   duco_id: my_duco
  #   node: 4
  #   action: reset_config
  #   name: "Node 4 configuratie resetten"
  #   entity_category: config
